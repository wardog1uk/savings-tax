# Uploads the production build to FTP after a commit lands on main.
#
# Deploy runs only when install, tests, and the Vite build all succeed.
# Add these repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER      hostname only, for example ftp.example.com
#   FTP_USERNAME
#   FTP_PASSWORD
#   FTP_SERVER_DIR  remote folder, must end with /  (optional, default ./)
#   FTP_PROTOCOL    ftp, ftps, or ftps-legacy       (optional, default ftp)
#   FTP_PORT        optional, default 21
name: Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ftp-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and upload
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Upload dist to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.ftp-deploy-sync-state.json
